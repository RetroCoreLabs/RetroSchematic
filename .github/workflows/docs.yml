name: Docs site on GitHub Pages

# Builds the documentation site and publishes it to
# https://retrocorelabs.github.io/RetroSchematic/ - site only: no .NET build, no release.
# MkDocs is installed here only (src/docs-site/requirements.txt).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      # The site shows Git LFS files: the symbol pictures in src/catalog/symbols and the icon in
      # src/assets. Without lfs: true they would be published as small pointer text files, with
      # a green build.
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-site/requirements.txt
      # The reference pages and the page tree are committed; fail when they are out of date.
      - run: python -I docs-site/gen_site.py --check
      - run: mkdocs build --strict -f docs-site/mkdocs.yml -d "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ runner.temp }}/site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
